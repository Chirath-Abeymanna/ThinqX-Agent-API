name: Build and Push Docker Images to GHCR

on:
  push:
    branches: [ main, devops ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_IMAGE_LINUX: ghcr.io/${{ github.repository_owner }}/python-backend-linux
  DOCKER_IMAGE_WINDOWS: ghcr.io/${{ github.repository_owner }}/python-backend-windows

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DEVOPS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate build tags
        id: meta-linux
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_LINUX }}
          tags: |
            type=raw,value=latest,enable={{is-default-branch}}
            type=sha

      - name: Build and push Linux image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.linux
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-linux.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DEVOPS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate build tags
        id: meta-windows
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_WINDOWS }}
          tags: |
            type=raw,value=latest,enable={{is-default-branch}}
            type=sha

      - name: Build and push Windows image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.windows
          platforms: windows/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-windows.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
