name: Build and Push Docker Images to GHCR

on:
  push:
    branches: [ main, devops ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_IMAGE_LINUX: ghcr.io/${{ github.repository_owner }}/python-backend-linux
  DOCKER_IMAGE_WINDOWS: ghcr.io/${{ github.repository_owner }}/python-backend-windows

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DEVOPS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate build tags
        id: meta-linux
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_LINUX }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Build and push Linux image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.linux
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta-linux.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DEVOPS_TOKEN }}

      - name: Generate build tags
        id: meta-windows
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_WINDOWS }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Build and push Windows image
        shell: pwsh
        run: |
          $tag = "ghcr.io/${{ toLower(github.repository_owner) }}/python-backend-windows:latest"
          docker build -f Dockerfile.windows -t $tag .
          echo ${{ secrets.DEVOPS_TOKEN }} | docker login ghcr.io -u ${{ toLower(github.repository_owner) }} --password-stdin
          if ("${{ github.event_name }}" -ne "pull_request") {
            docker push $tag
          } else {
            Write-Host "Skipping push for PR"
          }
