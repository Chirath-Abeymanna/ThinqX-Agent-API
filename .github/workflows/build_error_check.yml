name: API Build Error Check

on:
    push:
        branches:
            - '**'

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
                restore-keys: |
                    ${{ runner.os }}-pip-

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install flake8 black pytest
                if [ -f requirements.txt ]; then
                    pip install -r requirements.txt;
                fi

            - name: Check for dependency conflicts
              if: success()
              run: pip check
      
            - name: Run flake8 for linting
              run: flake8 . --max-line-length=88 --extend-ignore=E203

            - name: Run black to text formatting
              run: black . --check --diff

            - name: Run pytest
              run: pytest

            - name: Run the server
              run: |
                python start_server.py &
                sleep 5
                curl -f http://localhost:8000/health || exit 1
              env:
                PYTHONUNBUFFERED: 1

            - name: Notify failed quality check
              if: failure()
              uses: jayqi/failed-build-issue-action@v1
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
                title-template: "Python Code Quality Check Failed for branch {{ branch }}"
                body-template: "The Python code quality check failed on branch {{ branch }}. Please check the workflow logs for details."
