name: API Build Error Check

on:
    push:
        branches:
            - '**'

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.13'

            - name: Install Rust
              run: |
                curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
                echo "$HOME/.cargo/bin" >> $GITHUB_PATH
              env:
                RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup

            - name: Cache Rust dependencies
              uses: actions/cache@v4
              with:
                path: |
                  ~/.cargo/registry
                  ~/.cargo/git
                key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                restore-keys: |
                  ${{ runner.os }}-cargo-

            - name: Verify Rust Installation
              run: |
                rustc --version
                cargo --version

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
                restore-keys: |
                    ${{ runner.os }}-pip-
                    
            - name: Install system dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y libxml2-dev libxslt1-dev

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install black pytest pylint "cython>=3.0.0"
                if [ -f requirements.txt ]; then
                    pip install -r requirements.txt;
                fi

            - name: Check for dependency conflicts
              if: success()
              run: pip check

            - name: Run black to test formatting
              run: black . --check --diff
            
            - name: Run pylint for code analysis
              run: pylint **/*.py --rcfile=.pylintrc

            - name: Run pytest
              run: pytest

            - name: Run the server
              run: |
                python start_server.py &
                sleep 5
                curl -f http://localhost:8000/api/v1/crawler/scan || exit 1
              env:
                PYTHONUNBUFFERED: 1

            # - name: Notify failed quality check
